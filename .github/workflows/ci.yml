name: CI

on:
  push:
    branches:
      - '**'

jobs:
  build_firmware:
    name: Build Firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio
      - name: Build Firmware
        run: |
          platformio run -d Firmware

  build_software:
    name: Build Software
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure and build SoftwareC
        run: |
          cd SoftwareC
          cmake -S . -B build
          cmake --build build
